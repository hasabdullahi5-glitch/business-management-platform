<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales - Business Management Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="dashboard">

    <h1>Sales</h1>

    <p>Record and manage your business sales.</p>

    <!-- Sales Form -->

    <form method="POST" action="/sales">

        <label>Product</label>

        <select name="product_name" required>

            <option value="">Select a product</option>

            {% for product in products %}

            <option value="{{ product[1] }}">
                {{ product[1] }} (Stock: {{ product[3] }})
            </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            min="1"
            placeholder="Enter quantity"
            required
        >

        <br><br>

        <label>Price</label>

        <input
            type="number"
            name="price"
            min="0"
            placeholder="Enter price"
            required
        >

        <br><br>

        <button type="submit">
            Record Sale
        </button>

    </form>

    <br><br>

    <!-- Sales History -->

    <h2>Sales History</h2>

    <table>

        <tr>

            <th>ID</th>

            <th>Date & Time</th>

            <th>Product</th>

            <th>Quantity</th>

            <th>Price</th>

            <th>Total</th>

        </tr>

        {% for sale in sales %}

        <tr>

            <td>{{ sale[0] }}</td>

            <td>{{ sale[5] }}</td>

            <td>{{ sale[1] }}</td>

            <td>{{ sale[2] }}</td>

            <td>{{ currency_symbol }}{{ sale[3] }}</td>

            <td>{{ currency_symbol }}{{ sale[4] }}</td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/dashboard">
        Back to Dashboard
    </a>

</div>

</body>

</html>
