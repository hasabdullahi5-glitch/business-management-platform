<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Business Management Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="dashboard">

    <h1>Products</h1>

    <p>Add and manage the products in your business.</p>


    <!-- Add Product -->

    <form method="POST" action="/products">

        <label>Product Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter product name"
            required
        >

        <br><br>


        <label>Price</label>

        <input
            type="number"
            name="price"
            placeholder="Enter price"
            required
        >

        <br><br>


        <label>Quantity</label>

        <input
            type="number"
            name="quantity"
            placeholder="Enter quantity"
            required
        >

        <br><br>


        <button type="submit">
            Add Product
        </button>

    </form>


    <br><br>


    <!-- Product List -->

    <h2>Product List</h2>

    <table>

        <tr>

            <th>ID</th>

            <th>Product Name</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Action</th>

        </tr>


        {% for product in products %}

        <tr>

            <td>{{ product[0] }}</td>

            <td>{{ product[1] }}</td>

            <td>{{ currency_symbol }}{{ product[2] }}</td>

            <td>{{ product[3] }}</td>

            <td>

                <a href="/edit_product/{{ product[0] }}">
                    Edit
                </a>

                <a href="/delete_product/{{ product[0] }}">
                    Delete
                </a>

            </td>

        </tr>

        {% endfor %}


    </table>


    <br>


    <a href="/dashboard">
        Back to Dashboard
    </a>

</div>

</body>

</html>
