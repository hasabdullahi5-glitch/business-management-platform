<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Create an account for the Business Management Platform and manage your products, customers, sales, expenses and business reports.">

    <meta name="robots"
          content="index, follow">

    <meta name="theme-color"
          content="#080d1a">

    <meta property="og:title"
          content="Create an Account - Business Management Platform">

    <meta property="og:description"
          content="Create your Business Management Platform account and manage your business in one place.">

    <meta property="og:type"
          content="website">

    <title>Create Account - Business Management Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <h1>Business Management Platform</h1>

        <h2>Create Account</h2>

        <form method="POST" action="/register">

            <label>Full Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your full name"
                required
            >

            <br><br>

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <br><br>

            <button type="submit">
                Create Account
            </button>

        </form>

        <p>
            Already have an account?
            <a href="/">Login</a>
        </p>

    </div>

</body>

</html>
