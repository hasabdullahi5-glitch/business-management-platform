<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Business Management Platform for managing products, customers, sales, expenses and business reports.">

    <meta name="robots"
          content="index, follow">

    <meta name="theme-color"
          content="#080d1a">

    <meta property="og:title"
          content="Business Management Platform">

    <meta property="og:description"
          content="Manage your products, customers, sales, expenses and business reports in one platform.">

    <meta property="og:type"
          content="website">

    <title>Business Management Platform - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

          <link rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}">

<meta name="theme-color"
      content="#080d1a">
      
</head>

<body>

    <div class="login-container">

        <h1>Business Management Platform</h1>

        <h2>Login</h2>

        <form method="POST" action="/login">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="/register">Create Account</a>
        </p>

    </div>

</body>

</html>
