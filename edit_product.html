<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Business Management Platform</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="dashboard">

        <h1>Edit Product</h1>

        <p>Update the product information below.</p>


        <form method="POST">

            <label>Product Name</label>

            <input
                type="text"
                name="name"
                value="{{ product[1] }}"
                required
            >

            <br><br>


            <label>Price</label>

            <input
                type="number"
                name="price"
                value="{{ product[2] }}"
                required
            >

            <br><br>


            <label>Quantity</label>

            <input
                type="number"
                name="quantity"
                value="{{ product[3] }}"
                required
            >

            <br><br>


            <button type="submit">
                Update Product
            </button>

        </form>


        <br>


        <a href="/products">
            Back to Products
        </a>

    </div>

</body>

</html>
